architecture:
  frozen: true
  style:
    - DDD
    - Clean Architecture
    - Workflow Engine
    - Tool Registry
    - Plugin System
  decisions:
    - Domain owns business rules and validation.
    - Workflow coordinates stages through PipelineContext.
    - Infrastructure wraps external SDKs.
    - Tool registry resolves external tools.
    - Plugins provide optional capabilities through public contracts.
    - Speaker identifiers are internal subtitle metadata and are not written as
      SRT speaker labels.
    - Local transcribe defaults to structured intensive-listening JSON, with
      SRT available only as an optional export.
    - Local infrastructure adapter defaults are centralized in typed pipeline
      configuration objects.
    - pyannote.audio speaker diarization is an optional infrastructure wrapper
      around the WhisperX alignment contract.
    - Homophone resolution analyzes every sentence with Sudachi, then limits
      full contextual candidate scoring to three risk-ranked targets.
    - Local readability normalization restores commas after configured
      sentence-initial discourse markers without changing subtitle timing.
    - Sentence boundary resolution merges contiguous same-speaker dependent
      continuations before subtitle construction.
    - Optional learning-word normalization uses Sudachi morphology after
      homophone correction and preserves aligned word metadata.
    - Inflectional learning units use Sudachi dictionary, part-of-speech, and
      conjugation metadata rather than sentence-specific replacement tables.
    - Homophone replacement requires low ASR confidence, absolute and relative
      contextual evidence, and a stable Japanese script profile.
    - Unambiguous strict homophone confirmations may propagate within one
      document when each target retains local contextual support.
    - Document-confirmed homophones may bypass only the strict ratio or ASR
      confidence gate when the local candidate still beats the original.
    - Pipeline reuse is keyed by audio content and cumulative stage
      configuration/implementation fingerprints, with process-safe locking.
    - Incompatible audio is normalized atomically to reusable mono 16 kHz PCM
      only when an uncached audio-model stage requires it.
    - Audio adapters declare whether they require deterministic PCM; ordinary
      Whisper and WhisperX retain compressed source audio while pyannote
      normalization is deferred until after cached transcription.
    - Disabling cache reuse does not disable required media compatibility;
      cold pyannote runs still normalize after Whisper and report the duration.
    - Learning-word normalization locally reanalyzes short nominal windows and
      merges only standalone single-noun results recognized by Sudachi.
    - Diarizing alignment reports forced alignment, pyannote inference, and
      deterministic speaker assignment durations beside the aggregate stage.
    - Question-particle boundaries require independent alignment timing and
      configured sentence-final-form evidence rather than lexical exclusions.
    - Structural learning units use Unicode character classes and Sudachi
      morphology for identifiers, counters, katakana compounds, and auxiliary
      compatibility without vocabulary lists.
    - Supported video containers are converted to reusable deterministic PCM
      before audio loading, while outputs retain the original video identity.

